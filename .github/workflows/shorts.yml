name: Montage shorts

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Lien de la vidéo longue"
        required: true
        type: string
      job_id:
        description: "Identifiant unique du job (fourni par Make)"
        required: true
        type: string
      mode:
        description: "blur ou crop"
        required: false
        default: "blur"
        type: string
      title:
        description: "Titre de la vidéo"
        required: false
        default: ""
        type: string
      skip_upload:
        description: "Test : ne pas envoyer sur Drive (true/false)"
        required: false
        default: "false"
        type: string

concurrency:
  group: shorts-montage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  montage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VIDEO_URL: ${{ inputs.video_url }}
      JOB_ID: ${{ inputs.job_id }}
      MODE: ${{ inputs.mode }}
      TITLE: ${{ inputs.title }}
      SKIP_UPLOAD: ${{ inputs.skip_upload }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      MAKE_CALLBACK_URL: ${{ secrets.MAKE_CALLBACK_URL }}
      WORK_DIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4

      - name: Masquer les secrets dans les logs
        run: |
          for v in "$GROQ_API_KEY" "$DRIVE_FOLDER_ID" "$MAKE_CALLBACK_URL"; do
            [ -n "$v" ] && echo "::add-mask::$v"
          done
          exit 0

      - name: Installer les outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core rclone
          pip install -q -r requirements.txt

      - name: Montage
        run: python shorts.py

      - name: Callback de secours (si le script a planté)
        if: failure()
        run: python shorts.py --fallback
